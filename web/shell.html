<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOOM Remake</title>
<link rel="icon" href="BOOMRemake.png">
<style>
	:root {
		--bg: #000;
		--fg: #e8e4d8;
		--muted: #8d8a80;
		--accent: #e0a32e;
		--accent-fg: #1a1405;
	}
	* { box-sizing: border-box; }
	html, body {
		margin: 0;
		height: 100%;
		background: var(--bg);
		color: var(--fg);
		font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
	}
	body {
		overflow: hidden;
	}
	/* The canvas keeps the game's 640x480 resolution; CSS scales it up with
	   nearest-neighbour filtering, like the desktop build's window */
	#stage {
		position: relative;
		display: flex;
		align-items: center;
		justify-content: center;
		width: 100vw;
		height: 100dvh;
		overflow: hidden;
		background: var(--bg);
	}
	canvas {
		display: block;
		width: min(100vw, calc(100dvh * 4 / 3));
		aspect-ratio: 4 / 3;
		image-rendering: pixelated;
		outline: none;
	}
	#overlay {
		position: absolute;
		inset: 0;
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 16px;
		background: radial-gradient(circle at center, color-mix(in srgb, var(--accent) 12%, #000) 0%, #000 75%);
		text-align: center;
	}
	#overlay img { width: 96px; height: 96px; }
	#overlay h1 {
		margin: 0;
		font-size: clamp(28px, 6vw, 48px);
		letter-spacing: .08em;
		color: var(--accent);
	}
	#status { color: var(--muted); min-height: 1.4em; font-variant-numeric: tabular-nums; }
	progress {
		width: min(60%, 320px);
		accent-color: var(--accent);
	}
	button {
		font: inherit;
		font-weight: 600;
		padding: 10px 28px;
		border: 0;
		border-radius: 999px;
		background: var(--accent);
		color: var(--accent-fg);
		cursor: pointer;
	}
	button:disabled { opacity: .4; cursor: default; }
	[hidden] { display: none !important; }
</style>
</head>
<body>
	<div id="stage">
		<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
		<div id="overlay">
			<img src="BOOMRemake.png" alt="">
			<h1>BOOM Remake</h1>
			<progress id="progress" max="1" value="0" hidden></progress>
			<div id="status"></div>
			<button id="play" disabled>Download</button>
		</div>
	</div>

<script id="game-files" type="application/json">null</script>
<template id="game-script">{{{ SCRIPT }}}</template>
<script>
	const canvas = document.getElementById("canvas");
	const overlay = document.getElementById("overlay");
	const statusEl = document.getElementById("status");
	const progressEl = document.getElementById("progress");
	const playButton = document.getElementById("play");

	// Ask for the discrete GPU on machines that have two (SDL doesn't expose this setting)
	const getContext = canvas.getContext.bind(canvas);
	canvas.getContext = (type, attrs) =>
		getContext(type, type.startsWith("webgl") ? { ...attrs, powerPreference: "high-performance" } : attrs);

	// Cmd+F toggles fullscreen. This runs before the game's own key handling,
	// so the game never sees the keypress and the browser doesn't open its Find bar.
	window.addEventListener("keydown", (e) => {
		if (e.code === "KeyF" && e.metaKey && !e.repeat) {
			e.preventDefault();
			e.stopImmediatePropagation();
			if (document.fullscreenElement) {
				document.exitFullscreen();
			} else {
				document.getElementById("stage").requestFullscreen();
			}
		}
	}, true);

	// WebGL contexts can be lost (e.g. GPU reset); the game can't recover from that
	canvas.addEventListener("webglcontextlost", (e) => {
		e.preventDefault();
		showError("The WebGL context was lost. Reload the page to continue.");
	});

	function showError(text) {
		overlay.hidden = false;
		progressEl.hidden = true;
		playButton.hidden = true;
		statusEl.textContent = text;
	}

	var Module = {
		canvas,
		print: (text) => console.log(text),
		printErr: (text) => console.warn(text),
		// Saves, high scores and preferences live under $HOME: keep them in IndexedDB
		preRun: [() => {
			const home = "/home/web_user";
			Module.FS.mount(Module.IDBFS, {}, home);
			Module.addRunDependency("syncfs");
			Module.FS.syncfs(true, (err) => {
				if (err) console.warn("Loading saved data failed:", err);
				Module.removeRunDependency("syncfs");
			});
		}],
		onRuntimeInitialized() {
			progressEl.hidden = true;
			statusEl.textContent = "Ready";
			playButton.textContent = "Play";
			playButton.disabled = false;
			ready = true;
			playButton.focus();
		},
		onAbort(what) {
			showError("The game crashed: " + what);
		},
		onExit(code) {
			showError(code === 0 ? "Thanks for playing! Reload the page to play again." : "The game exited with an error.");
		},
	};

	// Nothing is downloaded until the player asks: the page shows how big the download is,
	// "Download" fetches the game and "Play" starts it. web-game-ports/build.py fills in #game-files
	// with the content-hashed file names and sizes it publishes; a plain build uses emcc's names.
	let files;
	let ready = false;
	const formatSize = (bytes) => `${(bytes / 1048576).toFixed(1)} MB`;

	async function getFiles() {
		const published = JSON.parse(document.getElementById("game-files").textContent);
		if (published) return published;
		const js = document.getElementById("game-script").content.querySelector("script").getAttribute("src");
		const base = js.replace(/\.js$/, "");
		const files = { js: { url: js }, wasm: { url: base + ".wasm" }, data: { url: base + ".data" } };
		await Promise.all(Object.values(files).map(async (file) => {
			const response = await fetch(file.url, { method: "HEAD" });
			if (!response.ok) throw new Error(`${file.url}: ${response.status} ${response.statusText}`);
			file.size = Number(response.headers.get("Content-Length")) || 0;
		}));
		return files;
	}

	async function download(file, onProgress) {
		const response = await fetch(file.url);
		if (!response.ok) throw new Error(`${file.url}: ${response.status} ${response.statusText}`);
		const chunks = [];
		const reader = response.body.getReader();
		for (;;) {
			const { done, value } = await reader.read();
			if (done) break;
			chunks.push(value);
			onProgress(value.length);
		}
		return new Blob(chunks).arrayBuffer();
	}

	async function load() {
		const total = files.js.size + files.wasm.size + files.data.size;
		let received = 0;
		progressEl.hidden = false;
		const onProgress = (bytes) => {
			received += bytes;
			progressEl.value = total ? Math.min(received / total, 1) : 0;
			statusEl.textContent = `Downloading… ${formatSize(received)} of ${formatSize(total)}`;
		};
		onProgress(0);
		const [js, wasm, data] = await Promise.all([files.js, files.wasm, files.data].map((file) => download(file, onProgress)));
		statusEl.textContent = "Starting…";
		// Hand the downloads to the Emscripten runtime so that it doesn't fetch them again
		Module.instantiateWasm = (imports, receiveInstance) => {
			WebAssembly.instantiate(wasm, imports).then(
				({ instance }) => receiveInstance(instance),
				(err) => showError("Starting the game failed: " + err.message));
			return {};
		};
		Module.getPreloadedPackage = () => data;
		const script = document.createElement("script");
		script.src = URL.createObjectURL(new Blob([js], { type: "text/javascript" }));
		document.body.append(script);
	}

	getFiles().then((found) => {
		files = found;
		statusEl.textContent = `${formatSize(files.js.size + files.wasm.size + files.data.size)} download`;
		playButton.disabled = false;
	}, (err) => showError("Couldn't find the game files: " + err.message));

	// Starting from a click also lets the browser unlock audio
	playButton.addEventListener("click", () => {
		if (!ready) {
			playButton.disabled = true;
			load().catch((err) => showError("Downloading the game failed: " + err.message));
			return;
		}
		overlay.hidden = true;
		canvas.focus();
		Module.callMain([]);
	});

	window.addEventListener("error", (e) => showError("Error: " + e.message));
</script>
</body>
</html>
